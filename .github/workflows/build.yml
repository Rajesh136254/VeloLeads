name: Build Executables (Windows & macOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate User Guide PDF
        run: python generate_pdf.py

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon="icon.ico" --add-data "icon.ico;." --name "VeloLeads" ui.py
          powershell Compress-Archive -Path dist/VeloLeads.exe, VeloLeads_User_Guide.pdf -DestinationPath dist/VeloLeads-Windows-EXE.zip -Force

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: VeloLeads-Windows-EXE
          path: dist/VeloLeads-Windows-EXE.zip

  build-mac:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate User Guide PDF
        run: python generate_pdf.py

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon="icon.ico" --add-data "icon.ico:." --name "VeloLeads" ui.py
          cp VeloLeads_User_Guide.pdf dist/
          cd dist
          if [ -d "VeloLeads.app" ]; then
            zip -r "VeloLeads-macOS.zip" "VeloLeads.app" "VeloLeads_User_Guide.pdf"
          else
            zip "VeloLeads-macOS.zip" "VeloLeads" "VeloLeads_User_Guide.pdf"
          fi

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloLeads-macOS-App
          path: dist/VeloLeads-macOS.zip

