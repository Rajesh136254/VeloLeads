name: Build Executables (Windows & macOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon="icon.ico" --add-data "icon.ico;." --name "VeloLeads" ui.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: VeloLeads-Windows-EXE
          path: dist/VeloLeads.exe

  build-mac:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon="icon.ico" --add-data "icon.ico:." --name "VeloLeads" ui.py
          cd dist
          if [ -d "VeloLeads.app" ]; then
            zip -r "VeloLeads-macOS.zip" "VeloLeads.app"
          else
            zip "VeloLeads-macOS.zip" "VeloLeads"
          fi

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloLeads-macOS-App
          path: dist/VeloLeads-macOS.zip
